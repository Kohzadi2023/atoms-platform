name: Phase 3 staging evidence

run-name: Phase 3 staging / ${{ inputs.change_ticket }}

on:
  workflow_dispatch:
    inputs:
      workflow_confirmation:
        description: Type RUN_PHASE3_STAGING
        required: true
        type: string
      change_ticket:
        description: Approved staging change-ticket identifier
        required: true
        type: string
      run_live_provider:
        description: Run the billable Supabase + Vault + E2B provider exit
        required: true
        default: false
        type: boolean
      destructive_confirmation:
        description: Type PROVISION_MIGRATE_AND_DESTROY_SUPABASE_STAGING_DATABASE for a live provider run
        required: false
        type: string
      measured_variable_cost_cad:
        description: Measured variable cost in CAD, with at most six decimals
        required: true
        type: string
      database_region:
        description: Generated-database region
        required: true
        default: americas
        type: choice
        options:
          - americas
          - emea
          - apac

permissions:
  actions: read
  contents: read

concurrency:
  group: phase3-staging-evidence
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate explicit scope and confirmations
        env:
          PHASE3_WORKFLOW_CONFIRMATION: ${{ inputs.workflow_confirmation }}
          PHASE3_RUN_LIVE_PROVIDER: ${{ inputs.run_live_provider }}
          PHASE3_STAGING_CHANGE_TICKET: ${{ inputs.change_ticket }}
          PHASE3_STAGING_MEASURED_COST_CAD: ${{ inputs.measured_variable_cost_cad }}
          PHASE3_STAGING_DESTRUCTIVE_CONFIRMATION: ${{ inputs.destructive_confirmation }}
        run: node scripts/validate-phase3-staging-inputs.mjs
      - name: Write durability preflight audit
        env:
          RUN_PHASE3_DURABILITY_INTEGRATION_TESTS: "true"
          PHASE3_INTEGRATION_DATABASE_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/placeholder
          REDIS_URL: redis://localhost:6379
        run: pnpm staging:phase3:preflight:json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-preflight-evidence
          path: |
            artifacts/phase3-preflight-durability.json
          if-no-files-found: warn
          retention-days: 30

  migration-and-durability:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atoms_upgrade
          POSTGRES_USER: atoms
          POSTGRES_PASSWORD: atoms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atoms -d atoms_upgrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: atoms
      PHASE3_STAGING_CHANGE_TICKET: ${{ inputs.change_ticket }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce durability preflight before integration test
        env:
          RUN_PHASE3_DURABILITY_INTEGRATION_TESTS: "true"
          PHASE3_INTEGRATION_DATABASE_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
          REDIS_URL: redis://localhost:6379
        run: pnpm staging:phase3:preflight
      - name: Upgrade Phase 2 to the complete Phase 3 schema
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
        run: |
          mv packages/db/prisma/migrations/20260801190000_phase3_david_database_provisioning /tmp/phase3-migration
          mv packages/db/prisma/migrations/20260801220000_phase3_database_reconciliation /tmp/phase3-reconciliation-migration
          pnpm db:migrate:deploy
          mv /tmp/phase3-migration packages/db/prisma/migrations/20260801190000_phase3_david_database_provisioning
          mv /tmp/phase3-reconciliation-migration packages/db/prisma/migrations/20260801220000_phase3_database_reconciliation
          pnpm db:migrate:deploy
          pnpm prisma migrate status
      - name: Exercise durable reconciliation against PostgreSQL and Redis
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
          REDIS_URL: redis://localhost:6379
          RUN_PHASE3_DURABILITY_INTEGRATION_TESTS: "true"
          PHASE3_INTEGRATION_DATABASE_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
        run: pnpm staging:phase3:durability
      - name: Apply the complete migration pack from empty
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_clean
        run: |
          psql -h localhost -U atoms -d postgres -c 'CREATE DATABASE atoms_clean'
          pnpm db:migrate:deploy
          pnpm prisma migrate status
      - name: Write machine-readable durability evidence
        env:
          PHASE3_DURABILITY_EVIDENCE_PATH: artifacts/phase3-durability-evidence.json
        run: node scripts/write-phase3-durability-evidence.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: phase3-durability-evidence
          path: artifacts/phase3-durability-evidence.json
          if-no-files-found: error
          retention-days: 30

  provider-exit:
    if: inputs.run_live_provider
    needs: migration-and-durability
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: phase3-staging
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atoms_provider_exit
          POSTGRES_USER: atoms
          POSTGRES_PASSWORD: atoms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atoms -d atoms_provider_exit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify protected live-provider environment policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PHASE3_STAGING_ENVIRONMENT: phase3-staging
        run: pnpm staging:phase3:environment-protection
      - run: pnpm install --frozen-lockfile
      - name: Start isolated ephemeral Vault
        shell: bash
        run: |
          set -euo pipefail

          # This token protects only the disposable Vault process on this
          # GitHub-hosted runner. It is generated per job, masked before use,
          # and never persisted as a repository or environment secret.
          vault_token="$(openssl rand -hex 32)"
          echo "::add-mask::${vault_token}"
          {
            echo "VAULT_ADDR=http://127.0.0.1:8200"
            echo "VAULT_TOKEN=${vault_token}"
            echo "VAULT_KV_MOUNT=secret"
          } >> "${GITHUB_ENV}"

          docker run --detach --rm \
            --name phase3-staging-vault \
            --cap-add IPC_LOCK \
            --publish 127.0.0.1:8200:8200 \
            --env "VAULT_DEV_ROOT_TOKEN_ID=${vault_token}" \
            --env "VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200" \
            hashicorp/vault:1.21.4@sha256:4e33b126a59c0c333b76fb4e894722462659a6bec7c48c9ee8cea56fccfd2569

          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8200/v1/sys/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          docker logs phase3-staging-vault
          exit 1
      - name: Enforce live-provider preflight and write audit
        env:
          RUN_PHASE3_DURABILITY_INTEGRATION_TESTS: "true"
          RUN_LIVE_PHASE3_STAGING: "true"
          PHASE3_STAGING_DESTRUCTIVE_CONFIRMATION: ${{ inputs.destructive_confirmation }}
          PHASE3_INTEGRATION_DATABASE_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
          PHASE3_STAGING_CHANGE_TICKET: ${{ inputs.change_ticket }}
          PHASE3_STAGING_MEASURED_COST_CAD: ${{ inputs.measured_variable_cost_cad }}
          PHASE3_STAGING_EVIDENCE_PATH: artifacts/phase3-provider-evidence.json
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_provider_exit
          REDIS_URL: redis://localhost:6379
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORGANIZATION_SLUG: ${{ vars.SUPABASE_ORGANIZATION_SLUG }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          PHASE3_STAGING_DATABASE_REGION: ${{ inputs.database_region }}
          PHASE3_STAGING_MIN_OTHER_ORG_CONTROLS: ${{ vars.PHASE3_STAGING_MIN_OTHER_ORG_CONTROLS || '1' }}
          PHASE3_STAGING_MIN_CUSTOMER_CONTROLS: ${{ vars.PHASE3_STAGING_MIN_CUSTOMER_CONTROLS || '1' }}
        run: pnpm staging:phase3:preflight:live:json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-preflight-live-evidence
          path: artifacts/phase3-preflight-live.json
          if-no-files-found: warn
          retention-days: 30
      - name: Prepare the dedicated provider-exit audit database
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_provider_exit
        run: pnpm db:migrate:deploy
      - name: Provision, migrate, verify, and clean up the staging database
        env:
          RUN_LIVE_PHASE3_STAGING: "true"
          PHASE3_STAGING_DESTRUCTIVE_CONFIRMATION: ${{ inputs.destructive_confirmation }}
          PHASE3_STAGING_CHANGE_TICKET: ${{ inputs.change_ticket }}
          PHASE3_STAGING_MEASURED_COST_CAD: ${{ inputs.measured_variable_cost_cad }}
          PHASE3_STAGING_DATABASE_REGION: ${{ inputs.database_region }}
          PHASE3_STAGING_EVIDENCE_PATH: artifacts/phase3-provider-evidence.json
          PHASE3_INTEGRATION_DATABASE_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_provider_exit
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_ORGANIZATION_SLUG: ${{ vars.SUPABASE_ORGANIZATION_SLUG }}
          SUPABASE_MANAGEMENT_API_URL: ${{ vars.SUPABASE_MANAGEMENT_API_URL || 'https://api.supabase.com' }}
          VAULT_NAMESPACE: ${{ vars.VAULT_NAMESPACE }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE }}
          E2B_ALLOWED_HOSTS: registry.npmjs.org,binaries.prisma.sh
          PHASE3_STAGING_MIN_OTHER_ORG_CONTROLS: ${{ vars.PHASE3_STAGING_MIN_OTHER_ORG_CONTROLS || '1' }}
          PHASE3_STAGING_MIN_CUSTOMER_CONTROLS: ${{ vars.PHASE3_STAGING_MIN_CUSTOMER_CONTROLS || '1' }}
        run: pnpm staging:phase3:provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-provider-evidence
          path: artifacts/phase3-provider-evidence.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop ephemeral Vault
        if: always()
        run: docker rm --force phase3-staging-vault 2> /dev/null || true
