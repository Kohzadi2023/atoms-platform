name: Preview certificate expiry

# The *.preview.genesisco.io wildcard certificate has no automatic renewal (issue #93).
# This opens one TLS connection to a name under it and fails when fewer than 30 days
# remain, so the failure notification is the reminder. Read-only: no credentials.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      min_days:
        description: Fail when fewer than this many days of validity remain
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the certificate the public Preview Gateway serves
        env:
          MIN_DAYS: ${{ inputs.min_days || '30' }}
        run: node scripts/check-preview-cert-expiry.mjs --min-days "$MIN_DAYS"
