services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atoms
      POSTGRES_USER: atoms
      POSTGRES_PASSWORD: atoms
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atoms -d atoms"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atoms_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - atoms_redis_data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: atoms-local
      MINIO_ROOT_PASSWORD: atoms-local-password
      MINIO_KMS_SECRET_KEY: local-dev-key:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MINIO_KMS_AUTO_ENCRYPTION: "on"
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - atoms_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 atoms-local atoms-local-password;
        do sleep 1; done;
        mc mb --ignore-existing local/atoms-attachments

  clamav:
    image: clamav/clamav:1.5.3
    ports:
      - "3310:3310"
    volumes:
      - atoms_clamav_data:/var/lib/clamav

volumes:
  atoms_postgres_data:
  atoms_redis_data:
  atoms_minio_data:
  atoms_clamav_data:
