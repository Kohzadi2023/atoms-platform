name: Preview certificate renewal

# Renews the *.preview.genesisco.io wildcard certificate (issue #93).
#
# DNS-01 challenges are answered in an Azure DNS zone (acme.genesisco.io) that Namecheap
# delegates to, through one CNAME at _acme-challenge.preview. Nothing here holds a Namecheap
# credential. See "Renewing the preview wildcard certificate" in
# docs/azure-container-apps-preview-staging.md for the one-time setup.
#
# Scheduled runs renew only when 45 days or fewer remain (plan job, no credentials).
# Manual runs default to `rehearse`: a full issue against the Let's Encrypt STAGING CA through
# the same DNS path, uploaded under a throwaway name to prove Azure accepts the PFX, then
# deleted. A rehearsal never binds anything and never touches the certificate in service.
# preview-cert-expiry.yml stays as the independent alarm: it fails under 30 days, which now
# means "automatic renewal has failed twice".

on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: rehearse = Let's Encrypt staging, nothing bound. renew = real certificate.
        type: choice
        options:
          - rehearse
          - renew
        default: rehearse
      force:
        description: With mode=renew, renew even when the certificate is outside the renewal window
        type: boolean
        default: false
      existing_certificate:
        description: With mode=renew, bind a certificate already uploaded to the environment (by name) instead of issuing a new one. Spends no Let's Encrypt quota; also the way to bind a previous certificate back by hand.
        type: string
        default: ""

permissions:
  contents: read

# One group per ref: a manual run from another branch must not displace a queued scheduled
# renewal on main (GitHub keeps only one pending run per group). That branch cannot reach
# the environment anyway, which is restricted to main.
concurrency:
  group: preview-cert-renewal-${{ github.ref }}
  cancel-in-progress: false

env:
  LEGO_VERSION: v5.5.2
  # SHA-256 of lego_v5.5.2_linux_amd64.tar.gz as published by the go-acme/lego release API.
  LEGO_SHA256: 2a35505089e7772c92e1e9ac144df91151ef2eca8568630db0ff91fca06d9bef
  ACME_ZONE_NAME: acme.genesisco.io
  PREVIEW_WILDCARD: "*.preview.genesisco.io"
  AZURE_RESOURCE_GROUP: atoms-staging-rg
  CONTAINER_ENV_NAME: atoms-staging-env
  GATEWAY_APP_NAME: atoms-staging-preview-gateway
  LETSENCRYPT_STAGING_URL: https://acme-staging-v02.api.letsencrypt.org/directory

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      renew: ${{ steps.plan.outputs.renew }}
      certificate_name: ${{ steps.plan.outputs.certificate_name }}
      existing_certificate: ${{ steps.existing.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Resolve the mode (scheduled runs are always real)
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: echo "mode=${INPUT_MODE:-renew}" >> "$GITHUB_OUTPUT"
      - name: Validate the optional existing certificate name
        id: existing
        env:
          INPUT_MODE: ${{ inputs.mode }}
          EXISTING: ${{ inputs.existing_certificate }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING" ]; then
            if [ "$INPUT_MODE" != "renew" ]; then echo "::error::existing_certificate needs mode=renew."; exit 1; fi
            # Only names this workflow creates (or the original certificate), never a free-form value.
            if ! [[ "$EXISTING" =~ ^genesisco-preview-wildcard-le(-[0-9]{8}-[0-9]{4}(-a[0-9]+)?)?$ ]]; then
              echo "::error::existing_certificate is not a certificate name this workflow creates."; exit 1
            fi
          fi
          echo "name=$EXISTING" >> "$GITHUB_OUTPUT"
      - name: Decide from the certificate the public Preview Gateway serves
        id: plan
        env:
          FORCE: ${{ inputs.force }}
          EXISTING: ${{ steps.existing.outputs.name }}
        run: |
          args=()
          # Binding a named certificate is a deliberate act, so it never waits for the renewal window.
          if [ "$FORCE" = "true" ] || [ -n "$EXISTING" ]; then args+=(--force); fi
          node scripts/plan-preview-cert-renewal.mjs "${args[@]}"

  issue:
    needs: plan
    if: needs.plan.outputs.mode == 'rehearse' || needs.plan.outputs.renew == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-cert-renewal
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      CERT_NAME: ${{ needs.plan.outputs.certificate_name }}
      EXISTING_CERT: ${{ needs.plan.outputs.existing_certificate }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install the pinned lego ACME client
        if: env.EXISTING_CERT == ''
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o lego.tar.gz \
            "https://github.com/go-acme/lego/releases/download/${LEGO_VERSION}/lego_${LEGO_VERSION}_linux_amd64.tar.gz"
          echo "${LEGO_SHA256}  lego.tar.gz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf lego.tar.gz -C "$RUNNER_TEMP/bin" lego
          rm lego.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Sign in to Azure with the renewal identity (OIDC, no stored secret)
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Generate a one-time PFX password
        if: env.EXISTING_CERT == ''
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "PFX_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Issue the certificate (DNS-01 through Azure DNS)
        if: env.EXISTING_CERT == ''
        env:
          AZURE_AUTH_METHOD: cli
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ZONE_NAME: ${{ env.ACME_ZONE_NAME }}
          AZURE_PROPAGATION_TIMEOUT: "300"
          LEGO_EMAIL: ${{ secrets.ACME_EMAIL }}
          LEGO_ACCEPT_TOS: "true"
          LEGO_DNS: azuredns
          LEGO_DOMAINS: ${{ env.PREVIEW_WILDCARD }}
          LEGO_PFX: "true"
          LEGO_PFX_PASSWORD: ${{ env.PFX_PASSWORD }}
        run: |
          set -euo pipefail
          export LEGO_PATH="$RUNNER_TEMP/lego"
          if [ "$MODE" = "rehearse" ]; then export LEGO_SERVER="$LETSENCRYPT_STAGING_URL"; fi
          lego run
          mapfile -t pfx < <(find "$LEGO_PATH" -name '*.pfx')
          if [ "${#pfx[@]}" -ne 1 ]; then echo "expected exactly one .pfx, found ${#pfx[@]}"; exit 1; fi
          echo "PFX_FILE=${pfx[0]}" >> "$GITHUB_ENV"

      - name: Upload the certificate under a new name (never overwrites the one in service)
        if: env.EXISTING_CERT == ''
        run: |
          set -euo pipefail
          # The attempt number keeps "Re-run failed jobs" from reusing, and so overwriting, a
          # name an earlier attempt may already have bound.
          upload_name="${CERT_NAME}-a${GITHUB_RUN_ATTEMPT}"
          if [ "$MODE" = "rehearse" ]; then upload_name="${upload_name}-rehearsal"; fi
          existing="$(az containerapp env certificate list --name "$CONTAINER_ENV_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='${upload_name}'] | length(@)" --output tsv)"
          if [ "$existing" != "0" ]; then echo "::error::A certificate named $upload_name already exists; refusing to overwrite it."; exit 1; fi
          echo "UPLOADED_NAME=$upload_name" >> "$GITHUB_ENV"
          az containerapp env certificate upload \
            --name "$CONTAINER_ENV_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --certificate-file "$PFX_FILE" --certificate-name "$upload_name" \
            --password "$PFX_PASSWORD" --only-show-errors --output none
          # Azure's own thumbprint of what was just uploaded. Verification later compares it with
          # the certificate the public Gateway serves, so a bind that never took effect cannot pass.
          thumbprint="$(az containerapp env certificate list --name "$CONTAINER_ENV_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='${upload_name}'].properties.thumbprint | [0]" --output tsv)"
          if ! [[ "$thumbprint" =~ ^[0-9A-Fa-f]{40}$ ]]; then echo "::error::Could not read the uploaded certificate's thumbprint."; exit 1; fi
          echo "NEW_CERT_THUMBPRINT=$thumbprint" >> "$GITHUB_ENV"

      - name: Use a certificate already uploaded to the environment
        if: env.EXISTING_CERT != ''
        run: |
          set -euo pipefail
          # No issuance, no upload: only a lookup of what Azure already holds under that name, so the
          # same fingerprint check as a fresh renewal applies to the bind that follows.
          thumbprint="$(az containerapp env certificate list --name "$CONTAINER_ENV_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?name=='${EXISTING_CERT}'].properties.thumbprint | [0]" --output tsv)"
          if ! [[ "$thumbprint" =~ ^[0-9A-Fa-f]{40}$ ]]; then echo "::error::No certificate named $EXISTING_CERT is uploaded to the environment."; exit 1; fi
          echo "UPLOADED_NAME=$EXISTING_CERT" >> "$GITHUB_ENV"
          echo "NEW_CERT_THUMBPRINT=$thumbprint" >> "$GITHUB_ENV"

      - name: Remember the certificate currently bound, for rollback
        if: env.MODE == 'renew'
        run: |
          set -euo pipefail
          previous="$(az containerapp hostname list --name "$GATEWAY_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --output json | jq -r --arg host "$PREVIEW_WILDCARD" '.[] | select(.name == $host) | .certificateId // empty')"
          if [ -z "$previous" ]; then echo "could not read the certificate currently bound to $PREVIEW_WILDCARD; not binding"; exit 1; fi
          echo "PREVIOUS_CERT_NAME=${previous##*/}" >> "$GITHUB_ENV"

      - name: Bind the new certificate to the Gateway wildcard hostname
        id: bind
        if: env.MODE == 'renew'
        run: |
          set -euo pipefail
          az containerapp hostname bind \
            --name "$GATEWAY_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --environment "$CONTAINER_ENV_NAME" --hostname "$PREVIEW_WILDCARD" \
            --certificate "$UPLOADED_NAME" --validation-method CNAME --only-show-errors --output none

      - name: Verify the public Gateway serves exactly the certificate just uploaded
        id: verify
        if: env.MODE == 'renew'
        run: |
          set -uo pipefail
          for attempt in $(seq 1 15); do
            if node scripts/check-preview-cert-expiry.mjs --min-days 14 --expect-fingerprint "$NEW_CERT_THUMBPRINT" \
              && code="$(curl -sS --max-time 20 -o "$RUNNER_TEMP/body" -w '%{http_code}' "https://renewal-check-${attempt}.preview.genesisco.io/")" \
              && [ "$code" = "401" ] && grep -q 'Invalid preview URL' "$RUNNER_TEMP/body"; then
              echo "The new certificate is being served."
              exit 0
            fi
            echo "attempt ${attempt}/15 not yet serving the new certificate; waiting 20 seconds"
            sleep 20
          done
          echo "::error::The new certificate was not confirmed as the one being served."
          exit 1

      # A separate step with always(), so it also runs when the bind itself failed or timed out
      # after Azure applied it, and when the job is cancelled mid-verification. It does not run
      # when nothing was bound (an earlier step failed) or when verification succeeded.
      - name: Roll back to the previous certificate when the new one is not confirmed
        if: always() && env.MODE == 'renew' && steps.bind.conclusion != 'skipped' && steps.verify.outcome != 'success'
        run: |
          set -euo pipefail
          if [ -z "${PREVIOUS_CERT_NAME:-}" ]; then echo "::error::No previous certificate was recorded; not rolling back."; exit 1; fi
          echo "::error::Rebinding the previous certificate ($PREVIOUS_CERT_NAME)."
          az containerapp hostname bind \
            --name "$GATEWAY_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
            --environment "$CONTAINER_ENV_NAME" --hostname "$PREVIEW_WILDCARD" \
            --certificate "$PREVIOUS_CERT_NAME" --validation-method CNAME --only-show-errors --output none

      - name: Remove key material and the rehearsal certificate
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/lego" "$RUNNER_TEMP/body"
          if [ "$MODE" = "rehearse" ] && [ -n "${UPLOADED_NAME:-}" ]; then
            az containerapp env certificate delete \
              --name "$CONTAINER_ENV_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --certificate "$UPLOADED_NAME" --yes --only-show-errors --output none \
              || echo "::warning::Could not delete the rehearsal certificate $UPLOADED_NAME; delete it by hand."
          fi
