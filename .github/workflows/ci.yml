name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fast_path: ${{ steps.classify.outputs.fast_path }}
      full_ci: ${{ steps.classify.outputs.full_ci }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify CI scope conservatively
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs
          else
            printf '%s\n' 'push-to-main' | node scripts/classify-ci-changes.mjs
          fi

  verify:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fast Web verification
        if: needs.changes.outputs.fast_path == 'true'
        run: |
          pnpm --filter @atoms/web... build
          pnpm --filter @atoms/web test
          pnpm --filter @atoms/web typecheck
          pnpm audit --audit-level high
          pnpm secrets:scan

      - name: Parse reusable staging PowerShell
        if: needs.changes.outputs.full_ci == 'true'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @(
            "deploy/staging/entra-web-cutover.ps1",
            "scripts/staging-public-smoke.ps1",
            "deploy/staging/preview-gateway-internal-health-smoke.ps1",
            "scripts/test-preview-internal-health.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path).Path,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "$path has PowerShell parser errors: $($errors -join '; ')"
            }
          }
          if ($failed) { throw "Reusable staging PowerShell parsing failed." }

      - name: Compile the dedicated Azure staging infrastructure
        if: needs.changes.outputs.full_ci == 'true'
        run: |
          az bicep install --version v0.46.1
          az bicep build --file infra/azure/staging/main.bicep --stdout > /dev/null
          az bicep build --file infra/azure/staging/managed-redis-private-dns.bicep --outfile /tmp/atoms-managed-redis-private-dns.json
          node scripts/verify-managed-redis-dns-template.mjs /tmp/atoms-managed-redis-private-dns.json

      - name: Validate the staging manifest, TLS ingress, and persistence contract
        if: needs.changes.outputs.full_ci == 'true'
        run: pnpm staging:deploy:compose:validate

      - name: Run full repository verification
        if: needs.changes.outputs.full_ci == 'true'
        run: pnpm run ci:verify

      - name: Smoke the production standalone MSAL redirect bridge
        run: pnpm staging:smoke:web-standalone-redirect

  migration-matrix:
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atoms_upgrade
          POSTGRES_USER: atoms
          POSTGRES_PASSWORD: atoms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atoms -d atoms_upgrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: atoms
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upgrade from the Phase 2 schema
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
        run: |
          mv packages/db/prisma/migrations/20260801190000_phase3_david_database_provisioning /tmp/phase3-migration
          mv packages/db/prisma/migrations/20260801220000_phase3_database_reconciliation /tmp/phase3-reconciliation-migration
          mv packages/db/prisma/migrations/20260802070000_secure_project_attachments /tmp/secure-attachments-migration
          pnpm db:migrate:deploy
          mv /tmp/phase3-migration packages/db/prisma/migrations/20260801190000_phase3_david_database_provisioning
          mv /tmp/phase3-reconciliation-migration packages/db/prisma/migrations/20260801220000_phase3_database_reconciliation
          mv /tmp/secure-attachments-migration packages/db/prisma/migrations/20260802070000_secure_project_attachments
          pnpm db:migrate:deploy
          pnpm prisma migrate status
      - name: Install the full migration pack from empty
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_clean
        run: |
          psql -h localhost -U atoms -d postgres -c 'CREATE DATABASE atoms_clean'
          pnpm db:migrate:deploy
          pnpm prisma migrate status
      - name: Seed the deterministic local workspace
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_clean
        run: |
          pnpm db:seed:local
          psql -h localhost -U atoms -d atoms_clean -tAc \
            "SELECT id FROM workspaces WHERE id = '00000000-0000-4000-8000-000000000001'" \
            | grep -Fx '00000000-0000-4000-8000-000000000001'
      - name: Exercise first-workspace onboarding against real PostgreSQL
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_clean
          RUN_WORKSPACE_ONBOARDING_INTEGRATION_TESTS: "true"
          WORKSPACE_ONBOARDING_INTEGRATION_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
        run: |
          pnpm --filter @atoms/control-api... build
          pnpm --filter @atoms/control-api test:workspace-onboarding:built
      - name: Exercise durable per-run provider budget against real PostgreSQL
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_clean
          RUN_PROVIDER_BUDGET_INTEGRATION_TESTS: "true"
          PROVIDER_BUDGET_INTEGRATION_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
        run: |
          pnpm --filter @atoms/orchestrator-worker... build
          pnpm --filter @atoms/orchestrator-worker test:provider-budget:built
      - name: Exercise PostgreSQL CAS and the BullMQ reconciliation scheduler
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
          REDIS_URL: redis://localhost:6379
          RUN_PHASE3_DURABILITY_INTEGRATION_TESTS: "true"
          PHASE3_INTEGRATION_DATABASE_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
        run: pnpm staging:phase3:durability
      - name: Exercise attachment quota, clean snapshots, and deterministic scan jobs
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
          REDIS_URL: redis://localhost:6379
          RUN_ATTACHMENT_INTEGRATION_TESTS: "true"
          ATTACHMENT_INTEGRATION_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
        run: pnpm staging:attachments:durability

  attachment-storage-integration:
    needs: changes
    if: needs.changes.outputs.full_ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: compose.yaml:deploy/ci/compose.storage.yaml
      COMPOSE_PROJECT_NAME: atoms-ci-storage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build pinned disposable MinIO dependencies from official sources
        run: |
          docker compose config --quiet
          docker compose build minio minio-init
      - name: Start disposable MinIO and ClamAV
        run: |
          docker compose up -d --no-build minio clamav
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 2
          done
          docker compose run --rm minio-init
          for attempt in {1..60}; do
            if docker compose exec -T clamav clamdscan --ping 1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 5
          done
      - name: Exercise signed storage, CORS, encryption, and malware scanning
        env:
          RUN_STORAGE_INTEGRATION_TESTS: "true"
          STORAGE_INTEGRATION_CONFIRMATION: DEDICATED_EPHEMERAL_STORAGE
          S3_BUCKET: atoms-attachments
          S3_REGION: us-east-1
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY_ID: atoms-local
          S3_SECRET_ACCESS_KEY: atoms-local-password
          S3_KMS_KEY_ID: local-dev-key
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "3310"
        run: pnpm staging:attachments:storage
      - name: Report attachment service logs on failure
        if: failure()
        run: docker compose logs --no-color minio minio-init clamav
      - name: Remove disposable attachment services
        if: always()
        run: docker compose down --volumes --remove-orphans
