name: Security Lock Refresh

on:
  push:
    branches:
      - fix/security-next-sharp-20260909

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/security-next-sharp-20260909
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Regenerate lockfile from pinned security versions
        run: pnpm install --no-frozen-lockfile
      - name: Verify patched dependency graph
        run: |
          pnpm --filter @atoms/web exec next --version
          pnpm audit --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'fix(deps): refresh lockfile for patched web dependencies'
          git push origin HEAD:fix/security-next-sharp-20260909
