openapi: 3.1.0
info:
  title: Atoms Secure Attachments API
  version: 1.0.0
  description: Versioned quarantine, scanning, and clean-download contract.
servers:
  - url: http://localhost:3001
paths:
  /v1/projects/{projectId}/attachments/upload-intents:
    post:
      operationId: createAttachmentUploadIntent
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttachmentUploadIntent"
      responses:
        "201":
          description: Upload intent persisted and signed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentUploadIntent"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/attachments:
    get:
      operationId: listProjectAttachments
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project attachment lifecycle records.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 5
                    items:
                      $ref: "#/components/schemas/ProjectAttachment"
        "404":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/attachments/{attachmentId}/complete:
    post:
      operationId: completeAttachmentUpload
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/AttachmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                etag:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        "202":
          description: Object verified and scan queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectAttachment"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /v1/projects/{projectId}/attachments/{attachmentId}/download:
    get:
      operationId: downloadProjectAttachment
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Five-minute signed download for a clean object.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, expiresAt]
                properties:
                  url:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Fail-closed API error.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  details: {}
  schemas:
    AttachmentMimeType:
      type: string
      enum: [application/pdf, text/plain, image/png, image/jpeg, image/webp]
    AttachmentStatus:
      type: string
      enum: [AWAITING_UPLOAD, QUARANTINED, SCANNING, CLEAN, REJECTED, FAILED, EXPIRED]
    CreateAttachmentUploadIntent:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sizeBytes]
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
        contentType:
          $ref: "#/components/schemas/AttachmentMimeType"
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
    ProjectAttachment:
      type: object
      additionalProperties: false
      required: [id, projectId, fileName, contentType, detectedContentType, sizeBytes, sha256, status, failureCode, createdAt, updatedAt, scannedAt]
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        fileName:
          type: string
        contentType:
          $ref: "#/components/schemas/AttachmentMimeType"
        detectedContentType:
          oneOf:
            - $ref: "#/components/schemas/AttachmentMimeType"
            - type: "null"
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
        sha256:
          type: [string, "null"]
          pattern: "^[a-f0-9]{64}$"
        status:
          $ref: "#/components/schemas/AttachmentStatus"
        failureCode:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        scannedAt:
          type: [string, "null"]
          format: date-time
    AttachmentUploadIntent:
      type: object
      additionalProperties: false
      required: [attachment, upload]
      properties:
        attachment:
          $ref: "#/components/schemas/ProjectAttachment"
        upload:
          type: object
          additionalProperties: false
          required: [method, url, headers, expiresAt]
          properties:
            method:
              const: PUT
            url:
              type: string
              format: uri
            headers:
              type: object
              additionalProperties:
                type: string
            expiresAt:
              type: string
              format: date-time
