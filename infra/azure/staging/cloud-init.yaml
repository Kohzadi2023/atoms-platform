#cloud-config
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - docker-compose-v2
  - docker.io
  - git
  - jq
  - ufw
  - unattended-upgrades

disk_setup:
  /dev/disk/azure/scsi1/lun0:
    table_type: gpt
    layout: true
    overwrite: false

fs_setup:
  - label: atoms-data
    filesystem: ext4
    device: /dev/disk/azure/scsi1/lun0
    partition: auto

mounts:
  - [LABEL=atoms-data, /var/lib/atoms, auto, "defaults,nofail,nodev,nosuid", "0", "2"]

write_files:
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "data-root": "/var/lib/atoms/docker",
        "log-driver": "json-file",
        "log-opts": {
          "max-file": "5",
          "max-size": "10m"
        }
      }
  - path: /etc/ssh/sshd_config.d/99-atoms-hardening.conf
    owner: root:root
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      X11Forwarding no
      AllowTcpForwarding no
  - path: /etc/sysctl.d/99-atoms-network.conf
    owner: root:root
    permissions: "0644"
    content: |
      net.ipv4.conf.all.accept_redirects=0
      net.ipv4.conf.default.accept_redirects=0
      net.ipv4.conf.all.send_redirects=0
      net.ipv4.conf.default.send_redirects=0

runcmd:
  - [install, -d, -m, "0755", /etc/atoms/staging]
  - [install, -d, -m, "0700", /etc/atoms/staging/secrets]
  - [install, -d, -m, "0700", /var/lib/atoms/staging]
  - [install, -d, -m, "0700", /var/lib/atoms/staging/backups]
  - [install, -d, -m, "0700", /var/lib/atoms/staging/evidence]
  - [install, -d, -m, "0755", /srv/atoms]
  - [usermod, -aG, docker, atomsadmin]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, docker]
  - [systemctl, restart, ssh]
  - [sysctl, --system]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, OpenSSH]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, allow, 443/udp]
  - [ufw, --force, enable]
  - [systemctl, enable, unattended-upgrades]
  - [touch, /var/lib/atoms/staging/host-bootstrap-complete]
