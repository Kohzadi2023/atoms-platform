name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the secret-safe staging manifest and TLS ingress
        run: pnpm staging:deploy:compose:validate
      - run: pnpm run ci:verify

  migration-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: atoms_upgrade
          POSTGRES_USER: atoms
          POSTGRES_PASSWORD: atoms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atoms -d atoms_upgrade"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: atoms
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Upgrade from the Phase 2 schema
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
        run: |
          mv packages/db/prisma/migrations/20260801190000_phase3_david_database_provisioning /tmp/phase3-migration
          mv packages/db/prisma/migrations/20260801220000_phase3_database_reconciliation /tmp/phase3-reconciliation-migration
          mv packages/db/prisma/migrations/20260802070000_secure_project_attachments /tmp/secure-attachments-migration
          pnpm db:migrate:deploy
          mv /tmp/phase3-migration packages/db/prisma/migrations/20260801190000_phase3_david_database_provisioning
          mv /tmp/phase3-reconciliation-migration packages/db/prisma/migrations/20260801220000_phase3_database_reconciliation
          mv /tmp/secure-attachments-migration packages/db/prisma/migrations/20260802070000_secure_project_attachments
          pnpm db:migrate:deploy
          pnpm prisma migrate status
      - name: Install the full migration pack from empty
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_clean
        run: |
          psql -h localhost -U atoms -d postgres -c 'CREATE DATABASE atoms_clean'
          pnpm db:migrate:deploy
          pnpm prisma migrate status
      - name: Seed the deterministic local workspace
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_clean
        run: |
          pnpm db:seed:local
          psql -h localhost -U atoms -d atoms_clean -tAc \
            "SELECT id FROM workspaces WHERE id = '00000000-0000-4000-8000-000000000001'" \
            | grep -Fx '00000000-0000-4000-8000-000000000001'
      - name: Exercise PostgreSQL CAS and the BullMQ reconciliation scheduler
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
          REDIS_URL: redis://localhost:6379
          RUN_PHASE3_DURABILITY_INTEGRATION_TESTS: "true"
          PHASE3_INTEGRATION_DATABASE_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
        run: pnpm staging:phase3:durability
      - name: Exercise attachment quota, clean snapshots, and deterministic scan jobs
        env:
          DATABASE_URL: postgresql://atoms:atoms@localhost:5432/atoms_upgrade
          REDIS_URL: redis://localhost:6379
          RUN_ATTACHMENT_INTEGRATION_TESTS: "true"
          ATTACHMENT_INTEGRATION_CONFIRMATION: DEDICATED_EPHEMERAL_DATABASE
        run: pnpm staging:attachments:durability

  attachment-storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable MinIO and ClamAV
        run: |
          docker compose up -d minio clamav
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 2
          done
          docker compose run --rm minio-init
          for attempt in {1..60}; do
            if docker compose exec -T clamav clamdscan --ping 1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 5
          done
      - name: Exercise signed storage, CORS, encryption, and malware scanning
        env:
          RUN_STORAGE_INTEGRATION_TESTS: "true"
          STORAGE_INTEGRATION_CONFIRMATION: DEDICATED_EPHEMERAL_STORAGE
          S3_BUCKET: atoms-attachments
          S3_REGION: us-east-1
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_ACCESS_KEY_ID: atoms-local
          S3_SECRET_ACCESS_KEY: atoms-local-password
          S3_KMS_KEY_ID: local-dev-key
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "3310"
        run: pnpm staging:attachments:storage
      - name: Report attachment service logs on failure
        if: failure()
        run: docker compose logs --no-color minio minio-init clamav
      - name: Remove disposable attachment services
        if: always()
        run: docker compose down --volumes --remove-orphans
